[project]
name = "horizon-defense"
version = "0.1.0"
description = "Horizon: A Two-Stage Guardrail Architecture with Robust Risk Bounds against Prompt Injection"
authors = [{ name = "Parsa", email = "parsabe99@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "statsmodels>=0.14.0",
    "cvxpy>=1.4.0",
    "clarabel>=0.7.0",
    "z3-solver>=4.12.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "mlflow>=2.10.0",
    "pytest>=7.4.0",
    "matplotlib>=3.8.0",
    "litellm>=1.30.0",
    "openai>=1.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
